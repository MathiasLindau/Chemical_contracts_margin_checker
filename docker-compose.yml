services:

  app_postgres:
    image: pgvector/pgvector:pg16
    container_name: app_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contracts_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - app_postgres
    volumes:
      - grafana_data:/var/lib/grafana

  app:
    build: .
    container_name: margin_checker_app
    ports:
      - "8502:8501"
    env_file:
      - .env
    environment:
      # Always use the Compose service name inside the app container,
      # even if .env points at localhost for local scripts.
      DB_CONN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@app_postgres:5432/${POSTGRES_DB:-contracts_db}
    depends_on:
      - app_postgres
    volumes:
      - .:/app

volumes:
  pgdata:
  grafana_data: