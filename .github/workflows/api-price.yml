name: Daily market prices

on:
  schedule:
    # GitHub runs cron in UTC. 04:00 UTC is 06:00 Berlin in summer,
    # 05:00 UTC is 06:00 Berlin in winter. The script keeps the run
    # that falls on a weekday between 06:00 and 09:00 Berlin time.
    - cron: "0 4 * * 1-5"
    - cron: "0 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install openpyxl==3.1.5
      - name: Pull the seven free series
        env:
          MARKET_PROBE_SCHEDULED: "1"
        run: python -m src.margin_checker.market_probe
      - name: Store the new row
        run: |
          git config user.name "MathiasLindau"
          git config user.email "mlindau007@gmail.com"
          git add data/market/api_price.csv
          if git diff --cached --quiet; then
            echo "no new row"
            exit 0
          fi
          git commit -m "Record the weekday market row in api_price.csv."
          git push
