[project]
name = "margin-checker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

authors = [
    { name = "Mathias Lindau", email = "mlindau007@gmail.com" }
]

requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "minsearch>=0.2.0",
    "openai>=3.3.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "streamlit>=1.62.0",
    "tqdm>=4.70.0",
]

[project.scripts]
margin-checker = "margin_checker:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"